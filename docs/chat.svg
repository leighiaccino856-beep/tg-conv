<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 660" width="460" height="660" role="img" aria-label="Как бот выглядит в чате Telegram">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <g id="scene">
      <rect width="160" height="90" fill="url(#sky)"/>
      <circle cx="121" cy="26" r="13" fill="#fde68a"/>
      <path d="M0 66 Q28 38 58 60 T110 54 Q136 44 160 58 V90 H0 Z" fill="url(#hill)"/>
      <path d="M0 80 Q36 60 74 76 T160 72 V90 H0 Z" fill="#166534"/>
      <path d="M18 30 q5 -6 10 0 M31 26 q5 -6 10 0" stroke="#e0f2fe" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <clipPath id="thumb"><rect x="140" y="146" width="296" height="167" rx="10"/></clipPath>
    <clipPath id="note"><circle cx="90" cy="486" r="62"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="459" height="659" rx="24" fill="#ffffff" stroke="#e5e7eb"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <!-- шапка -->
    <rect x="0" y="0" width="460" height="64" fill="#ffffff"/>
    <line x1="0" y1="64" x2="460" y2="64" stroke="#e5e7eb"/>
    <circle cx="34" cy="32" r="17" fill="#2563eb"/>
    <text x="34" y="36" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">tg</text>
    <text x="60" y="28" font-size="15" font-weight="700" fill="#111827">tg-conv</text>
    <text x="60" y="46" font-size="12" fill="#6b7280">bot</text>

    <!-- чат -->
    <rect x="0" y="64" width="460" height="536" fill="#eef2f7"/>

    <rect x="16" y="84" width="300" height="40" rx="14" fill="#ffffff"/>
    <text x="30" y="109" font-size="13" fill="#111827">Пришли видео — сделаю кружок.</text>

    <!-- сообщение пользователя с видео -->
    <rect x="132" y="138" width="312" height="214" rx="14" fill="#effdde"/>
    <g clip-path="url(#thumb)">
      <svg x="140" y="146" width="296" height="167" viewBox="0 0 160 90">
        <use href="#scene"/>
      </svg>
    </g>
    <circle cx="288" cy="229" r="22" fill="#0f172a" opacity="0.35"/>
    <path d="M282 219 L299 229 L282 239 Z" fill="#ffffff"/>
    <text x="148" y="337" font-size="12" fill="#374151">video.mp4 · 6,8 МБ</text>
    <text x="432" y="337" font-size="11" fill="#6b7280" text-anchor="end">12:34</text>

    <!-- статус конвертации -->
    <rect x="16" y="372" width="246" height="42" rx="14" fill="#ffffff"/>
    <text x="30" y="398" font-size="13" fill="#111827">Конвертирую в кружок… 63%</text>

    <!-- готовый кружок -->
    <g clip-path="url(#note)">
      <svg x="28" y="424" width="124" height="124" viewBox="35 0 90 90">
        <use href="#scene"/>
      </svg>
    </g>
    <circle cx="90" cy="486" r="18" fill="#0f172a" opacity="0.3"/>
    <path d="M85 477 L99 486 L85 495 Z" fill="#ffffff"/>
    <rect x="40" y="526" width="44" height="20" rx="10" fill="#0f172a" opacity="0.55"/>
    <text x="62" y="540" font-size="10.5" fill="#ffffff" text-anchor="middle">0:12</text>
    <text x="162" y="536" font-size="11" fill="#6b7280">12:35</text>

    <!-- поле ввода -->
    <rect x="0" y="600" width="460" height="60" fill="#ffffff"/>
    <line x1="0" y1="600" x2="460" y2="600" stroke="#e5e7eb"/>
    <rect x="16" y="612" width="392" height="32" rx="16" fill="#f1f5f9"/>
    <text x="32" y="633" font-size="13" fill="#94a3b8">Сообщение</text>
    <circle cx="430" cy="628" r="14" fill="#2563eb"/>
    <path d="M430 620 a4 4 0 0 1 4 4 v7 l2 3 h-12 l2 -3 v-7 a4 4 0 0 1 4 -4 Z" fill="#ffffff"/>
  </g>
</svg>
